name: CI Pipeline

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  # ==========================================
  # 1. .NET Backend CI (Multi-project support)
  # ==========================================
  backend-ci:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Discover and Test .NET Solutions/Projects
        run: |
          # Test projects build their backend references without building frontend esproj files.
          mapfile -t PROJECTS < <(find src/Bifrost -type f \( -name '*.Test.csproj' -o -name '*.Tests.csproj' -o -name '*.IntegrationTests.csproj' \) | sort)
          test "${#PROJECTS[@]}" -gt 0
          for project in "${PROJECTS[@]}"; do
            dotnet test "$project" --configuration Release --verbosity minimal -m:1 -nr:false \
              --collect:"XPlat Code Coverage" --settings scripts/Test/coverage.runsettings \
              --results-directory "Test/coverage/TestResults/$(basename "$project" .csproj)" --logger trx
          done

      - name: Upload backend test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: Test/coverage/TestResults

  # ==========================================
  # 2. Frontend CI (Angular / React / Node)
  # ==========================================
  frontend-ci:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover and Test Frontend Projects
        env:
          CI: true
        run: |
          # Find all directories containing package.json (excluding node_modules and .github)
          mapfile -t PKG_DIRS < <(find . -name "package.json" -not -path "*/node_modules/*" -not -path "*/.github/*" -not -path "./scripts/*" -exec dirname {} \;)

          if [ ${#PKG_DIRS[@]} -gt 0 ]; then
            echo "Found ${#PKG_DIRS[@]} Node/Frontend project(s):"
            for dir in "${PKG_DIRS[@]}"; do
              echo "==> Processing frontend directory: $dir"
              pushd "$dir" > /dev/null

              if [ -f "package-lock.json" ]; then
                npm ci
              else
                npm install
              fi

              npm run lint --if-present
              npm test --if-present
              npm run build --if-present

              popd > /dev/null
            done
          else
            echo "No package.json files found outside system directories. Skipping."
          fi
