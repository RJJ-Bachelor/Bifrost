<bifrost-topbar />
<div class="page-container">
  <bifrost-card title="Dine sessioner">
    @if (!sessions.isLoading() && !sessions.error() && !isEmpty()) {
      <div card-header class="join-menu">
        <button
          class="btn"
          [class.btn--primary]="!userOpenedJoin()"
          [class.btn--secondary]="userOpenedJoin()"
          (click)="toggleJoinForm()"
        >
          {{ userOpenedJoin() ? 'Annuller' : '+ Tilmeld via kode' }}
        </button>
        @if (userOpenedJoin()) {
          <div class="join-menu__dropdown">
            <bifrost-session-join-form
              [error]="joinError()"
              (joined)="onJoin($event)"
            />
          </div>
        }
      </div>
    }

    @if (sessions.isLoading()) {
      <p class="state-message">Indlæser sessioner...</p>
    } @else if (sessions.error()) {
      <p class="state-message">Kunne ikke hente sessioner.</p>
    } @else {
      @if (isEmpty()) {
        <div class="join-area join-area--centered">
          <bifrost-session-join-form
            [error]="joinError()"
            (joined)="onJoin($event)"
          />
        </div>
      }

      <bifrost-session-list [sessions]="sessions.value()" />
    }
  </bifrost-card>
</div>
