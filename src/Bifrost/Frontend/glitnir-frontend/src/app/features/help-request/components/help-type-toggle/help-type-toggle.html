<div class="toggle">
  <button
    type="button"
    class="toggle__option"
    [class.toggle__option--active]="value() === 'physical'"
    (click)="valueChange.emit('physical')"
  >
    <span class="icon icon--physical"></span>
    Fysisk
  </button>
  <button
    type="button"
    class="toggle__option"
    [class.toggle__option--active]="value() === 'digital'"
    (click)="valueChange.emit('digital')"
  >
    <span class="icon icon--digital"></span>
    Digitalt
  </button>
</div>
