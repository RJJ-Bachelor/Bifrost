@if (items().length === 0) {
  <p class="state-message">Du har ikke stillet nogen spørgsmål endnu.</p>
} @else {
  <div class="question-list">
    @for (item of sorted(); track item.id) {
      <bifrost-list-row
        [muted]="!isOpen(item.status)"
        (click)="questionSelected.emit(item)"
      >
        <span left>{{ item.message }}</span>
        <span right class="question-list__badge">
          {{ label(item.status) }}
        </span>
        @if (isOpen(item.status)) {
          <span
            right
            class="question-list__chevron"
          ></span>
        }
      </bifrost-list-row>
    }
  </div>
}
