<form (submit)="onSubmit($event)">
  <textarea
    class="message-form__textarea"
    [placeholder]="placeholder()"
    [formField]="messageForm.message"
  ></textarea>

  <div class="message-form__error-slot">
    @if (error()) {
      <p class="message-form__error">{{ error() }}</p>
    }
  </div>

  <button
    type="submit"
    class="btn btn--primary message-form__submit"
    [disabled]="messageForm().invalid() || submitting()"
  >
    {{ submitLabel() }}
    <span class="message-form__submit-icon"></span>
  </button>
</form>
