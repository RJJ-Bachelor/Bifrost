<form class="create-form" (submit)="onSubmit($event)">
  <input
    type="text"
    class="input-field create-form__input"
    placeholder="Navn på session..."
    [formField]="createForm.title"
  />
  <div class="create-form__error">{{ error() }}</div>
  <div class="form-actions">
    @if (showCancel()) {
      <button
        type="button"
        class="btn btn--secondary"
        (click)="cancelled.emit()"
      >
        Annuller
      </button>
    }
    <button
      type="submit"
      class="btn btn--primary"
      [disabled]="createForm().invalid()"
    >
      Opret
    </button>
  </div>
</form>
