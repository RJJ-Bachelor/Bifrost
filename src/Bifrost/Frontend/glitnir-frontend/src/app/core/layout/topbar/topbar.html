<header class="topbar">
  <div class="topbar__left">
    <a
      class="topbar__brand"
      [routerLink]="homeLink()"
      (mouseenter)="onBrandEnter()"
      (mouseleave)="onBrandLeave()"
    >
      <img class="topbar__logo" src="bifrost-logo.svg" alt="" />
      <span class="topbar__name">Bifrost</span>
    </a>
    @if (switcherRevealed()) {
      <div (mouseenter)="onSwitcherEnter()" (mouseleave)="onSwitcherLeave()">
        <bifrost-view-switcher />
      </div>
    }
  </div>
  <div class="topbar__center">
    <ng-content select="[topbar-center]" />
  </div>
  <div class="topbar__right">
    <ng-content select="[topbar-right]" />
  </div>
</header>
