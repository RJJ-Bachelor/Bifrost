<header class="topbar" [class.topbar--teacher]="authStore.isTeacher()">
  <a class="topbar__brand" [routerLink]="homeLink()">
    <img class="topbar__logo" src="bifrost-logo.svg" alt="" />
    <span class="topbar__name">Bifrost</span>
  </a>
  <div class="topbar__left">
    <ng-content select="[topbar-left]" />
  </div>
  <div class="topbar__center">
    <ng-content select="[topbar-center]" />
  </div>
  <div class="topbar__right">
    <ng-content select="[topbar-right]" />
  </div>
</header>
