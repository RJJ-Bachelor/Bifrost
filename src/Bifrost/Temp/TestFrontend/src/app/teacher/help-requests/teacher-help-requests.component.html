<section class="card">
  <div class="section-heading"><div><p class="eyebrow">HJÆLPEKØ</p><h2>Ventende <span class="count">{{ view.waitingRequests.length }}</span></h2></div><button (click)="view.takeNext()" [disabled]="view.busy || view.waitingRequests.length === 0">Tag næste →</button></div>
  <p class="hint">Tag næste anmodning for at starte fysisk hjælp eller sende et digitalt svar.</p>
  <div *ngIf="view.waitingRequests.length === 0" class="empty-state compact"><span class="empty-symbol" aria-hidden="true">✓</span><h3>Køen er tom</h3><p>Nye spørgsmål vises her automatisk.</p></div>
  <div class="queue-list">
    <button *ngFor="let request of view.waitingRequests; let position = index" class="queue-item" [class.selected]="request.id === view.selectedRequestId" (click)="view.openRequest(request.id)" [disabled]="view.busy">
      <span class="queue-position">{{ position + 1 }}</span>
      <span class="queue-item-content"><span class="request-item-heading"><strong>{{ request.displayNumber }}</strong><span class="status">{{ request.helpType === 'Physical' ? 'Fysisk' : 'Digital' }}</span></span><span class="request-preview">{{ request.messages.at(0)?.text }}</span><span class="hint">{{ request.assignedTeacherId ? 'Reserveret' : 'Venter på hjælp' }}</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </button>
  </div>
</section>
<section class="card">
  <div class="section-heading"><div><p class="eyebrow">FYSISK HJÆLP</p><h2>I gang <span class="count">{{ view.activeRequests.length }}</span></h2></div></div>
  <p *ngIf="view.activeRequests.length === 0" class="hint">Ingen aktiv fysisk hjælp lige nu.</p>
  <div class="request-list">
    <button *ngFor="let request of view.activeRequests" class="request-item" [class.selected]="request.id === view.selectedRequestId" (click)="view.openRequest(request.id)" [disabled]="view.busy">
      <span class="request-item-heading"><strong>{{ request.displayNumber }}</strong><span class="status" data-status="Active">I gang</span></span>
      <span class="request-preview">{{ request.messages.at(0)?.text }}</span><span class="hint">Åbn for at afslutte eller sende forrest i køen →</span>
    </button>
  </div>
</section>
