<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="Bifrost, forside"><span class="brand-mark" aria-hidden="true">B</span><span>BIFROST<small>Hjælp i undervisningen</small></span></a>
    <nav aria-label="Hovedmenu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Forside</a>
      <a routerLink="/students" routerLinkActive="active">Studerende</a>
      <a routerLink="/teachers" routerLinkActive="active">Underviser</a>
    </nav>
  </div>
</header>
<main id="main-content"><router-outlet /></main>
<footer class="site-footer"><span>Bifrost</span><span>Testfrontend · EirService</span></footer>
<div *ngIf="notifications.current() as notification" class="notification-overlay">
  <section class="notification-modal" role="dialog" aria-modal="true" aria-labelledby="notification-title">
    <p class="eyebrow">BIFROST</p>
    <h2 id="notification-title">Ny notifikation</h2>
    <p>{{ notification.message }}</p>
    <button type="button" (click)="notifications.dismiss()" autofocus>Luk</button>
  </section>
</div>
