info:
  name: Login
  type: http
  seq: 1
http:
  method: GET
  url: '{{gatewayUrl}}/api/teachers/me'
  auth: null
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.isSafeMode()) throw new Error("Select Developer Mode in Bruno to log in as a teacher.");
        await require("./lib/teacher-login.cjs")(bru, req);
