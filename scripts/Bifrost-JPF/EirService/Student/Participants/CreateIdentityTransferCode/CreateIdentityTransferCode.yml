info:
  name: CreateIdentityTransferCode
  type: http
  seq: 1
http:
  method: POST
  url: '{{gatewayUrl}}/api/students/identity-transfer-codes'
  auth: null
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const body = res.getBody();
          const data = typeof body === "string" ? JSON.parse(body) : body;
          bru.setVar("identityTransferCode", data.code);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: '200'
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: |-
  Run while signed in as the student whose identity and history should be restored
  in another browser or device. The source identity comes from the student cookie.
  Returns a single-use code and expiresAtUtc. The code expires after ten minutes.
  Saves the code as identityTransferCode for RedeemIdentityTransferCode.
  Keep the code private: anyone with it can restore this student identity.
