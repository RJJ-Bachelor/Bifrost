info:
  name: GetSessionArchives
  type: http
  seq: 1
http:
  method: GET
  url: '{{gatewayUrl}}/api/teachers/sessions/{{sessionId}}/archives'
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: |-
  Lists archived generations for the selected session.
  Each generation includes privateConversationCount (one per private conversation/HelpRequest)
  and generalizedQuestionCount (all archived FAQ questions, including unanswered ones).
  To inspect an older generation, replace {{archiveId}} in GetSessionArchive's URL with its id once.
  Listing archives preserves the current sessionGeneration and archiveId.
