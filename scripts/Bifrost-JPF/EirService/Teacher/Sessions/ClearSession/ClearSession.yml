info:
  name: ClearSession
  type: http
  seq: 1

http:
  method: POST
  url: "{{gatewayUrl}}/api/teachers/sessions/{{sessionId}}/clear"
  body:
    type: json
    data: |-
      {
        "expectedGeneration": {{sessionGeneration}}
      }

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: true
