info:
  name: TakeNextHelpRequest
  type: http
  seq: 1
http:
  method: POST
  url: '{{gatewayUrl}}/api/teachers/sessions/{{sessionId}}/queue/take-next'
  auth: null
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: |-
  Reserves the next waiting request for the current teacher. Shared FAQ questions have priority.
  A teacher can have at most one assigned Pending or Active request in this session and generation.
  If such a request already exists, this call returns it without reserving another, including during active physical help.
  The collection automatically saves the returned id as teacherHelpRequestId for GetHelpRequest, answers and status changes.
  A FAQ has isFaq=true; it is answered through the same AnswerHelpRequest endpoint.
  With no existing own request and no unreserved waiting request, returns 204.
  GetTeacherQueueStatus exposes unreservedWaitingCount and myReservedRequestId for Take next and Continue controls.
  Development/Take next FAQ handles the seeded demo ids automatically.
