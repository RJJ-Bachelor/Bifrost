info:
  name: GetSessionStatistics
  type: http
  seq: 1
http:
  method: GET
  url: '{{gatewayUrl}}/api/teachers/sessions/{{sessionId}}/statistics'
  auth: null
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: |-
  Today's statistics for the selected session's current generation, without a calendar-date filter.
  Requires teacher login and membership of this session.
  Returns physicalCount and digitalCount for completed requests by HelpType,
  helpedStudentCount for distinct non-null StudentId values among completed requests,
  and averageWaitMinutes as the average of ClosedAt - QueuedAt in minutes.
  Completed statuses are CompletedByFaq, CompletedByDigital and CompletedByPhysical.
  With no completed requests, counts are zero and averageWaitMinutes is null.
  Average time (averageWaitMinutes) covers the entire request from joining the queue to completion:
  both waiting and help. A student who waits 6 minutes and receives 4 minutes of help contributes 10 minutes.
  Estimated wait (estimatedWaitMinutes) on the student queue endpoints is calculated separately:
  average time between starts × number of requests ahead, rounded up to whole minutes.
  averageWaitMinutes is not used as the minutes per queue position in that estimate.
