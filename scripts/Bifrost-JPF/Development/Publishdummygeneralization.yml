info:
  name: Publish dummy generalization
  type: http
  seq: 2
http:
  method: POST
  url: '{{gatewayUrl}}/api/teachers/development/generalizations'
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{{generalizationPayload}}'
  auth: null
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("seedReady")) {
          throw new Error("Run 'Seed FAQ demo' successfully first.");
        }
  assertions:
    - expression: res.status
      operator: eq
      value: '202'
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: |-
  Sends the first two seeded help requests as a dummy generalization through Mimir's existing outbox.
  Delivery is asynchronous. Refresh the teacher queue after this request.
  Sending the same payload again tests redelivery with the same generalization id.
