info:
  name: Create digital help request (new session)
  type: http
  seq: 1
http:
  method: POST
  url: '{{gatewayUrl}}/api/students/sessions/{{sessionId}}/requests'
  auth: null
  body:
    type: json
    data: |-
      {
        "message": "Hej, jeg hedder Peter og forstår ikke hvorfor min for-løkke i Python aldrig stopper?",
        "helpType": "Digital"
      }
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
runtime:
  scripts:
    - type: before-request
      code: |-
        // A new session per run, because a student can only have one open request per session.
        await bru.runRequest("Login/Teacher/Login");
        const session = (await bru.runRequest("EirService/Teacher/Sessions/CreateSession/CreateSession")).data;
        require("./lib/response-variables.cjs").captureSession(bru, session);
        await bru.runRequest("EirService/Student/Participants/JoinSession/JoinSession");
    - type: after-response
      code: |-
        if (res.status === 201) require("./lib/response-variables.cjs").captureHelpRequest(bru, res.getBody(), "students");
docs: |-
  Creates a fresh Eir session, joins as a student and sends one ordinary digital help request.
  Mimir receives request.created and runs its normal generalization flow.
  To publish a dummy generalization directly, use MimirService/Publish generalization (dummy data).
  For manual requests in an existing session, use EirService/Student/HelpRequests/CreateHelpRequest/CreateDigitalRequest.
