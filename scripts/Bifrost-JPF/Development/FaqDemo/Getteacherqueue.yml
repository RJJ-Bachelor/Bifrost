info:
  name: Get teacher queue
  type: http
  seq: 2
http:
  method: GET
  url: '{{gatewayUrl}}/api/teachers/sessions/{{faqDemoSessionId}}/queue'
  auth: null
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("seedReady")) {
          throw new Error("Run 'Seed FAQ demo' successfully first.");
        }
  assertions:
    - expression: res.status
      operator: eq
      value: '200'
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: Shows the seeded queue. Once Mimir's message arrives, the FAQ should be at the front.
